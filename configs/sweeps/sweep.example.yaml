name: example_random_search
output_dir: outputs/sweeps
num_trials: 8
search_strategy: random
seed: 42
objective_metric: eval_f1_macro
objective_mode: max

base_config:
  model_name: FacebookAI/xlm-roberta-base
  output_dir: outputs/training
  run_name: baseline

  train_file: data/splits/train.csv
  validation_file: data/splits/validation.csv
  test_file: data/splits/test.csv
  text_column:
  spans_column: spans
  optional_string_columns: []

  max_length: 512
  train_learning_rate: 5.0e-5
  train_batch_size: 8
  train_epochs: 10
  train_weight_decay: 0.01
  gradient_accumulation_steps: 1
  warmup_ratio: 0.06

  logging_steps: 100
  dataloader_num_workers: 2
  fp16: false
  save_total_limit: 1
  primary_metric: eval_f1_macro
  report_target: none
  early_stopping_enabled: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.001

search_space:
  train_learning_rate:
    min: 1.0e-5
    max: 8.0e-5
    type: float
    log: true
  train_batch_size:
    values: [4, 8, 16]
    type: int
  train_epochs:
    values: [5, 10, 15]
    type: int
  train_weight_decay:
    values: [0.0, 0.01, 0.05]
    type: float
  warmup_ratio:
    values: [0.0, 0.06, 0.1]
    type: float
