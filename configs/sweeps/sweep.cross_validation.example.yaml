name: five_fold_nervaluate_search
output_dir: outputs/sweeps
num_trials: 8
search_strategy: random
seed: 137
objective_metric: eval_nervaluate_partial_micro_f1
objective_mode: max

cross_validation:
  folds: 5
  seed: 211
  group_column: document_id
  stratify_by: iterative_multilabel

base_config:
  model_name: FacebookAI/xlm-roberta-base
  output_dir: outputs/training
  run_name: baseline
  train_file: data/splits/train.csv
  validation_file: data/splits/validation.csv
  test_file: data/splits/test.csv
  optional_string_columns: [document_id]
  max_length: 512
  train_batch_size: 8
  train_epochs: 10
  fp16: false
  primary_metric: eval_nervaluate_partial_micro_f1
  save_total_limit: 1

search_space:
  train_learning_rate:
    min: 1.0e-5
    max: 8.0e-5
    type: float
    log: true
  train_batch_size:
    values: [4, 8, 16]
    type: int
  train_weight_decay:
    values: [0.0, 0.01, 0.05]
    type: float
